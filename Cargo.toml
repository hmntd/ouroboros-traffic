[package]
name = "ouroboros-traffic"
version = "0.1.0"
edition = "2024"
authors = ["Ruslan Bazavluk"]
license = "MIT"
description = "A zero-player traffic simulation and algorithmic city optimization experiment in Rust and WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Window",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
